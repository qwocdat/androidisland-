name: Android CI & Release APK (Auto-Extract ZIP & Build)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Auto-Extract ZIP, Sync Repo & Build Androidisland APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-Find Uploaded ZIP, Extract Overwriting Existing Files & Push
        shell: bash
        run: |
          set -e
          echo "Scanning for uploaded zip files in repo..."
          mapfile -t ZIP_FILES < <(find . -maxdepth 2 -type f -name "*.zip" \
            ! -path "./.git/*" \
            ! -path "./.gradle/*" \
            ! -path "./gradle/*" \
            ! -path "./app/build/*" \
            ! -path "./build/*" | sort)

          if [ "${#ZIP_FILES[@]}" -gt 0 ]; then
            echo "Found ${#ZIP_FILES[@]} ZIP file(s): ${ZIP_FILES[*]}"
            for ZIP_PATH in "${ZIP_FILES[@]}"; do
              echo "===> Extracting: $ZIP_PATH"
              TMP_EXTRACT=$(mktemp -d)
              unzip -o -q "$ZIP_PATH" -d "$TMP_EXTRACT"

              # Check if ZIP has a root wrapper folder
              shopt -s dotglob nullglob
              ITEMS=("$TMP_EXTRACT"/*)
              if [ "${#ITEMS[@]}" -eq 1 ] && [ -d "${ITEMS[0]}" ] && [ ! -f "$TMP_EXTRACT/settings.gradle.kts" ]; then
                SRC_DIR="${ITEMS[0]}"
                echo "Nested folder detected: $(basename "$SRC_DIR")"
              else
                SRC_DIR="$TMP_EXTRACT"
              fi

              # Overwrite files into root
              rsync -a --exclude='.git' "$SRC_DIR"/ ./
              shopt -u dotglob nullglob
              rm -rf "$TMP_EXTRACT"

              # Delete the zip file so it is removed from repo
              rm -f "$ZIP_PATH"
              echo "Extracted and deleted: $ZIP_PATH"
            done

            if [ -f gradle.properties ]; then
              sed -i '/^org\.gradle\.java\.home=/d' gradle.properties || true
            fi
            if [ -f ./gradlew ]; then
              chmod +x ./gradlew
            fi

            # Git commit and push back to branch
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A

            if ! git diff --cached --quiet; then
              echo "Committing extracted files..."
              git commit -m "chore: auto-extract uploaded zip and overwrite source files [skip ci]"
              CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
              if [ "$CURRENT_BRANCH" = "HEAD" ]; then
                CURRENT_BRANCH="${GITHUB_REF_NAME:-main}"
              fi
              echo "Pushing changes back to origin/$CURRENT_BRANCH..."
              git push origin "HEAD:$CURRENT_BRANCH" || git push -f origin "HEAD:$CURRENT_BRANCH" || true
            else
              echo "No diff after extracting zip."
            fi
          else
            echo "No zip files found in repository."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache & Wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle & Accept Android SDK Licenses
        run: |
          if [ -f gradle.properties ]; then
            sed -i '/^org\.gradle\.java\.home=/d' gradle.properties || true
          fi
          chmod +x ./gradlew
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          elif [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" ]; then
            yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          fi

      - name: Build Debug & Release APKs
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Collect Generated APKs
        run: |
          mkdir -p output_apks
          echo "Scanning built APKs:"
          find app/build/outputs/apk/ -type f -name "*.apk" -ls

          DEBUG_APK=$(find app/build/outputs/apk/debug/ -type f -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$DEBUG_APK" ]; then
            DEBUG_APK=$(find app/build/outputs/apk/ -type f -name "*debug*.apk" 2>/dev/null | head -n 1)
          fi

          RELEASE_APK=$(find app/build/outputs/apk/release/ -type f -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            RELEASE_APK=$(find app/build/outputs/apk/ -type f -name "*release*.apk" 2>/dev/null | head -n 1)
          fi

          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            echo "Found debug APK: $DEBUG_APK"
            cp "$DEBUG_APK" output_apks/Androidisland.apk
          fi

          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            echo "Found release APK: $RELEASE_APK"
            cp "$RELEASE_APK" output_apks/Androidisland-release-unsigned.apk
          fi

          ls -la output_apks/

      - name: Upload Debug APK Artifact (Ready to Install)
        uses: actions/upload-artifact@v4
        with:
          name: Androidisland-APK-Installable
          path: output_apks/Androidisland.apk

      - name: Upload Release APK Artifact (Unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: Androidisland-Release-Unsigned
          path: output_apks/Androidisland-release-unsigned.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v2.5.{0}', github.run_number) }}
          name: Androidisland Liquid Edition (${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v2.5.{0}', github.run_number) }})
          body: |
            ## 🚀 Bản cập nhật Androidisland — Liquid Edition (by digitalxiao)
            - **Giao diện Liquid Island 5 Tab mới**: Trang chủ (`Home`), Hoạt động (`Activities`), Phím tắt (`Shortcuts`), Cài đặt (`Settings`), Giao diện (`Appearance`) & màn hình cài đặt Vật lý Chuyển động (`Animation`).
            - **Thanh điều hướng Liquid Glass Tabbar**: Tích hợp hiệu ứng khúc xạ thấu kính, bóng đổ trong (`InnerShadow`), kéo lò xo vật lý (`DampedDragAnimation`) và ánh sáng viền theo cảm biến nghiêng máy.
            - **Tính năng hoạt động thật 100%**: Ghi âm nhanh (Voice Memo) hiển thị sóng âm trực tiếp trên Đảo động, Điều khiển cử chỉ vuốt/chạm trên Đảo, Bộ chỉnh âm 5 dải tần (5-Band Hardware Equalizer), Tiết kiệm pin thông minh, Quản lý cấu hình JSON (Xuất/Nhập), Đa nhiệm 2 viên thuốc và Phòng thử nghiệm nhà phát triển.
            - **Đa ngôn ngữ (13 ngôn ngữ)**: Tiếng Việt (`🇻🇳 Tiếng Việt`) là ngôn ngữ mặc định, giữ nguyên 12 ngôn ngữ quốc tế trên video.
            - **Giữ nguyên 100% tính năng gốc**: Xác thực Key bản quyền (DigitalVolume), Đảo đen mặc định khi rảnh, Thanh cạnh Droidbar, Tác vụ nhanh chuỗi, Thông báo video TikTok (`https://vt.tiktok.com/ZSpBjvVcP/`) & Tự động cập nhật GitHub.
            - Tải tệp **Androidisland.apk** bên dưới để cài đặt trực tiếp trên điện thoại Android.
          files: |
            output_apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
