name: Build Androidisland APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
      - 'V*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập JDK 21 (hỗ trợ Gradle 9.1 & Toolchain 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Thiết lập Android SDK
        uses: android-actions/setup-android@v3

      - name: Cấu hình Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Cấp quyền thực thi cho gradlew
        run: chmod +x ./gradlew

      - name: Build APK (Release & Debug)
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Chuẩn bị file Androidisland.apk
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/Androidisland-release.apk dist/Androidisland.apk
          cp app/build/outputs/apk/debug/Androidisland-debug.apk dist/Androidisland-debug.apk
          ls -lh dist/

      - name: Tải lên APK Artifact (Androidisland.apk)
        uses: actions/upload-artifact@v4
        with:
          name: Androidisland-APK
          path: |
            dist/Androidisland.apk
            dist/Androidisland-debug.apk
          if-no-files-found: error

      - name: Tự động tạo GitHub Release (khi push tag v*)
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Androidisland.apk
          generate_release_notes: true
